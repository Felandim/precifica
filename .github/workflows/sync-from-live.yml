# Traz para a main os arquivos públicos do site durável (here.now), verificando o sha256 de cada um.
# O manifesto (site-manifest.txt) é publicado junto com o site; na main fica só site-manifest.sha256 (uma linha),
# que prova que o manifesto baixado do ar é o mesmo gerado pelo tools/stage-public.sh. Não publica nada (sem GitHub Pages).
# Fluxo diário: stage-public.sh -> publicar no here.now -> commitar site-manifest.sha256 (+ fontes) na main -> este workflow roda.
name: sync-from-live
on:
  push:
    branches: [main]
    paths: [site-manifest.sha256, .github/workflows/sync-from-live.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sync
  cancel-in-progress: false
env:
  LIVE: https://mellow-quarry-n7jk.here.now
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baixar e verificar o manifesto do ar
        run: |
          set -euo pipefail
          read -r want _ < site-manifest.sha256
          curl -fsSL --retry 5 --retry-delay 10 "$LIVE/site-manifest.txt" -o "$RUNNER_TEMP/site-manifest.txt"
          echo "$want  $RUNNER_TEMP/site-manifest.txt" | sha256sum -c -
      - name: Baixar e verificar arquivos do site
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/pub" && mkdir -p "$RUNNER_TEMP/pub"
          while read -r sha path; do
            [ -z "$path" ] && continue
            case "$path" in /*|*..*) echo "caminho inválido: $path"; exit 1;; esac
            mkdir -p "$RUNNER_TEMP/pub/$(dirname "$path")"
            curl -fsSL --retry 5 --retry-delay 10 "$LIVE/$path" -o "$RUNNER_TEMP/pub/$path"
            echo "$sha  $RUNNER_TEMP/pub/$path" | sha256sum -c --quiet -
          done < "$RUNNER_TEMP/site-manifest.txt"
          cp "$RUNNER_TEMP/site-manifest.txt" "$RUNNER_TEMP/pub/site-manifest.txt"
          echo "ok: $(wc -l < "$RUNNER_TEMP/site-manifest.txt") arquivos verificados"
      - name: Commit na main
        run: |
          set -euo pipefail
          cp -a "$RUNNER_TEMP/pub/." .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "main já atualizada"; else git commit -q -m "site: sync do here.now ($(date -u +%F))" && git push origin HEAD:main; fi
