# Traz para a main os arquivos públicos do site durável (Cloudflare Pages, projeto precifica-br), verificando o sha256 de cada um.
# O manifesto (site-manifest.txt) é publicado junto com o site; na main fica só site-manifest.sha256 (uma linha),
# que prova que o manifesto baixado do ar é o mesmo gerado pelo tools/stage-public.sh. Não publica nada (sem GitHub Pages).
# Arquivos que saem do manifesto (ferramenta tirada do ar) também saem da main.
# Fluxo diário: tools/deploy-pages.sh (stage + Cloudflare Pages) -> commitar site-manifest.sha256 (+ fontes) na main -> este workflow roda.
name: sync-from-live
on:
  push:
    branches: [main]
    paths: [site-manifest.sha256, .github/workflows/sync-from-live.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sync
  cancel-in-progress: false
env:
  LIVE: https://precifica-br.pages.dev
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baixar e verificar o manifesto do ar
        run: |
          set -euo pipefail
          read -r want _ < site-manifest.sha256
          curl -fsSL --retry 5 --retry-delay 10 "$LIVE/site-manifest.txt" -o "$RUNNER_TEMP/site-manifest.txt"
          echo "$want  $RUNNER_TEMP/site-manifest.txt" | sha256sum -c -
      - name: Baixar e verificar arquivos do site
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/pub" && mkdir -p "$RUNNER_TEMP/pub"
          while read -r sha path; do
            [ -z "$path" ] && continue
            case "$path" in /*|*..*) echo "caminho inválido: $path"; exit 1;; esac
            # Arquivos de configuração do Cloudflare Pages não são servidos; ficam como estão na main.
            case "$path" in _headers|_redirects|_routes.json) continue;; esac
            mkdir -p "$RUNNER_TEMP/pub/$(dirname "$path")"
            curl -fsSL --retry 5 --retry-delay 10 "$LIVE/$path" -o "$RUNNER_TEMP/pub/$path"
            echo "$sha  $RUNNER_TEMP/pub/$path" | sha256sum -c --quiet -
          done < "$RUNNER_TEMP/site-manifest.txt"
          cp "$RUNNER_TEMP/site-manifest.txt" "$RUNNER_TEMP/pub/site-manifest.txt"
          echo "ok: $(wc -l < "$RUNNER_TEMP/site-manifest.txt") arquivos verificados"
      - name: Commit na main
        run: |
          set -euo pipefail
          # Arquivo que estava no manifesto anterior (commitado) e saiu do novo foi tirado do ar: remover da main também.
          if [ -f site-manifest.txt ]; then
            sed 's/^[0-9a-f]\{64\}  //' site-manifest.txt | LC_ALL=C sort -u > "$RUNNER_TEMP/old.list"
            sed 's/^[0-9a-f]\{64\}  //' "$RUNNER_TEMP/pub/site-manifest.txt" | LC_ALL=C sort -u > "$RUNNER_TEMP/new.list"
            LC_ALL=C comm -23 "$RUNNER_TEMP/old.list" "$RUNNER_TEMP/new.list" | while read -r path; do
              case "$path" in ""|/*|*..*|.github/*|_headers|_redirects|_routes.json) continue;; esac
              if [ -e "$path" ]; then git rm -q -- "$path"; echo "removido (saiu do ar): $path"; fi
            done
          fi
          cp -a "$RUNNER_TEMP/pub/." .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "main já atualizada"; else git commit -q -m "site: sync do Cloudflare Pages ($(date -u +%F))" && git push origin HEAD:main; fi
